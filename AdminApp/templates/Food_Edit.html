<!DOCTYPE html>
<html lang="en">
{% extends 'dashboard.html' %}
{% block content %}
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="col-md-12 grid-margin stretch-card">
    <div class="card">
        <div class="card-body">
            <h4 class="card-title">Edit category Here </h4>
            <form class="forms-sample" method="post" action="{% url 'Food_update' c_id=data.id %}" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="form-group">
                    <label for="exampleInputUsername1">Category Name</label>
                    <input type="text" class="form-control" id="exampleInputUsername1" name="cname"
                           placeholder="Category Name" value="{{data.category_name}}">
                </div>
              <div class="form-group">
                    <label for="exampleInputUsername1">Food Name</label>
                    <input type="text" class="form-control" id="exampleInputUsername2" name="fname"
                           placeholder="Category Name" value="{{data.food_name}}">
                </div>

                <div class="form-group">
                    <label for="exampleInputUsername1">Price</label>
                    <input type="text" class="form-control" id="exampleInputUsername5" name="price"
                           placeholder="price" value="{{data.price}}">
                </div>

                <div class="form-group">
                    <label for="exampleInputUsername1">avialable</label>
                    <input type="text" class="form-control" id="exampleInputUsername10" name="avialable"
                           placeholder="avialable" value="{{data.avialable}}">
                </div>

                <div class="form-floating mb-3">
                    <label for="floatingTextarea">Description</label>

                    <textarea class="form-control" placeholder="Description" id="floatingTextarea"
                              style="height: 150px;" name="description">{{data.description}}</textarea>
                </div>
                <div class="form-group">
                <img src="{{data.food_image.url}}" width="100px" height="100px" class="mb-3">

                    <label for="exampleInputUsername1">Food Image</label>
                    <input type="file" class="form-control" id="exampleInputUsername3" name="Image" placeholder="Image" >
                </div>

                <button type="submit" class="btn btn-primary mr-2">Submit</button>
                <button class="btn btn-light" type="submit">Cancel</button>
            </form>
        </div>
    </div>
</div>


</body>
</html>
{% endblock %}
