<!DOCTYPE html>
<html>
<head>
    <title>Edit Reservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Edit Reservation</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Customer Name</label>
            <input type="text"
                   class="form-control"
                   name="customer_name"
                   value="{{ booking.customer_name }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text"
                   class="form-control"
                   name="phone"
                   value="{{ booking.phone }}"
                   required>
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email"
                   class="form-control"
                   name="email"
                   value="{{ booking.email }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Booking Date</label>
            <input type="date"
                   class="form-control"
                   name="booking_date"
                   value="{{ booking.booking_date|date:'Y-m-d' }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Booking Time</label>
            <input type="time"
                   class="form-control"
                   name="booking_time"
                   value="{{ booking.booking_time|time:'H:i' }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Guests</label>
            <input type="number"
                   class="form-control"
                   name="guests"
                   value="{{ booking.guests }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Table</label>

            <select class="form-select" name="table">

                {% for table in tables %}

                <option value="{{ table.id }}" {% if booking.table_id == table.id %}selected{% endif %}>
                    Table {{ table.Table_no }} ({{ table.Capacity }} Seats)
                </option>

                {% endfor %}

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Status</label>

            <select class="form-select" name="status">

                {% for value, label in booking.STATUS_CHOICES %}

                <option value="{{ value }}" {% if booking.status == value %}selected{% endif %}>
                    {{ label }}
                </option>

                {% endfor %}

            </select>

        </div>

        <button type="submit" class="btn btn-success">
            Update Reservation
        </button>

        <a href="{% url 'view_reservation' %}" class="btn btn-secondary">
            Back
        </a>

    </form>

</div>

</body>
</html>
