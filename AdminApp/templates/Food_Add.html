<!DOCTYPE html>
<html lang="en">
{% extends 'dashboard.html' %}
{% block content %}
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="col-md-12 grid-margin stretch-card">
    <div class="card">
        <div class="card-body">
            <h4 class="card-title">Add Food Here </h4>
            <form class="forms-sample" method="post" action="{% url 'Food_Save' %}" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="form-group">
                    <label for="exampleInputUsername1">Food Name</label>
                    <input type="text" class="form-control" id="exampleInputUsername1" name="fname"
                           placeholder="Food Name">
                </div>
              <div class="form-group">
                    <label for="exampleInputUsername1">Category Name</label>
                    <input type="text" class="form-control" id="exampleInputUsername2" name="cname"
                           placeholder="Category Name">
                </div>
                <div class="form-group">
                    <label for="exampleInputUsername1">Price</label>
                    <input type="text" class="form-control" id="exampleInputUsername8" name="Price"
                           placeholder="Price">
                </div>
                <div class="form-group">
                    <label for="exampleInputUsername1">Availability</label>
                    <input type="text" class="form-control" id="exampleInputUsername7" name="Availability"
                           placeholder="Availability">
                </div>
                <div class="form-floating mb-3">
                    <label for="floatingTextarea">Description</label>
                    <textarea class="form-control" placeholder="Description" id="floatingTextarea"
                              style="height: 150px;" name="description"></textarea>
                </div>

                <div class="form-group">
                    <label for="exampleInputUsername1"> Image</label>
                    <input type="file" class="form-control" id="exampleInputUsername3" name="Image" placeholder="Image">
                </div>


                <button type="submit" class="btn btn-primary mr-2">Submit</button>
                <button class="btn btn-light" type="submit">Cancel</button>
            </form>
        </div>
    </div>
</div>

<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
{% if messages %}
    {% for i in messages %}
        {% if i.tags == 'success' %}
            <script>
                swal('{{ i }}', '', 'success');
            </script>
        {% elif i.tags == 'error' %}
            <script>
                swal('{{ i }}', '', 'error');
            </script>
        {% elif i.tags == 'warning' %}
            <script>
                swal('{{ i }}', '', 'warning');
            </script>
        {% else %}
            <script>
                swal('{{ i }}', '', 'info');
            </script>
        {% endif %}
    {% endfor %}
{% endif %}


</body>
</html>
{% endblock %}
